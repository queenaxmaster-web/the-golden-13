        <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Golden 13 | Apobangpo Sanctuary</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ========== BASE COLORS ========== */
:root{
    --bg-dark:#0b0618;
    --bg-light:#f5f1ff;

    --card-dark:rgba(255,255,255,0.05);
    --card-light:rgba(0,0,0,0.05);

    --purple:#7c3aed;
    --gold:#d4af37;

    --text-dark:#ffffff;
    --text-light:#1a1a1a;
}

/* ========== GLOBAL ========== */
body{
    margin:0;
    font-family:Poppins, sans-serif;
    transition:0.4s;
}

/* ========== DARK THEME (PURPLE + GOLD) ========== */
body.dark{
    background:linear-gradient(180deg,#0b0618,#120022,#05010a);
    color:var(--text-dark);
}

/* ========== LIGHT THEME ========== */
body.light{
    background:var(--bg-light);
    color:var(--text-light);
}

/* ========== ARIRANG THEME (RED + WHITE ONLY) ========== */
body.arirang{
    background:linear-gradient(135deg,#b30000,#7a0000);
    color:#ffffff;
}

/* ========== HEADER ========== */
header{
    text-align:center;
    padding:20px;
    font-family:"Playfair Display", serif;
    font-size:22px;
    letter-spacing:2px;
}

/* ========== CONTAINER ========== */
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* ========== CARDS ========== */
.card{
    padding:25px;
    margin:20px 0;
    border-radius:18px;
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.1);
}

body.dark .card{
    background:var(--card-dark);
}

body.light .card{
    background:var(--card-light);
}

body.arirang .card{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
}

/* ========== TITLE ========== */
.title{
    font-size:42px;
    font-family:"Playfair Display", serif;
    background:linear-gradient(90deg,var(--purple),var(--gold));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ========== BUTTONS ========== */
button{
    padding:10px 18px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.btn-purple{background:var(--purple); color:white;}
.btn-gold{background:var(--gold); color:black;}
.btn-red{background:#b30000; color:white;}

button:hover{
    transform:scale(1.05);
}

/* ========== THEME SWITCH ========== */
.theme-switch{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
}

.small{
    font-size:14px;
    opacity:0.8;
}
</style>
</head>

<body class="dark">

<header>
THE GOLDEN 13 — APOBANGPO SANCTUARY
<div class="small">2013 — 2026</div>
</header>

<div class="theme-switch">
    <button class="btn-purple" onclick="setTheme('dark')">Dark</button>
    <button class="btn-gold" onclick="setTheme('light')">Light</button>
    <button class="btn-red" onclick="setTheme('arirang')">Arirang</button>
</div>

<div class="container">

<div class="card">
    <div class="title">Welcome to the Sanctuary</div>
    <p>
        A digital space built for healing, reflection, and memory.
    </p>
</div>

<div class="card">
    <h2>Enter the Sanctuary</h2>
    <button class="btn-purple">Start Journey</button>
</div>

</div>

<script>
function setTheme(mode){
    document.body.className = "";

    if(mode === 'dark'){
        document.body.classList.add('dark');
    }

    if(mode === 'light'){
        document.body.classList.add('light');
    }

    if(mode === 'arirang'){
        document.body.classList.add('arirang');
    }
}
</script>

</body>
</html>
