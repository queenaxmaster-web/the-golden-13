<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation Universe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="app-content">
        <section id="constellation" class="page active">
            <h2>🌌 Constellation Universe</h2>
            <p>Welcome to the global sky. Stars are aligning...</p>
            <div class="mock-map">✨ [Interactive Map Will Go Here] ✨</div>
        </section>

        <section id="magic-shop" class="page">
            <h2>🔮 Magic Shop</h2>
            <p>Enter your feelings, receive comfort.</p>
            <input type="text" placeholder="How are you feeling today, ARMY?">
            <button>Enter</button>
        </section>

        <section id="army-space" class="page">
            <h2>💬 ARMY Space</h2>
            <p>Real-time community feed.</p>
            <div class="mock-feed">
                <p><strong>@RM_Monstar:</strong> Welcome to our universe! 💜</p>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchPage('constellation')">🌌 Sky</button>
        <button class="nav-btn" onclick="switchPage('magic-shop')">🔮 Shop</button>
        <button class="nav-btn" onclick="switchPage('army-space')">💬 Space</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
